name: VM2 App Block Label
on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  add-blocking-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add controlled blocking label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['VM2_APP_BLOCK_0929'],
            })
