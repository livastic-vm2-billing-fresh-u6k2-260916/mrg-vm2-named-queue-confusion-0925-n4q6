name: VM2 Productoff Auto Final Gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  auto-final:
    name: vm2-productoff-auto-final-gate
    runs-on: ubuntu-latest
    steps:
      - name: Hold finalizer long enough for owner product revocation
        run: |
          echo "VM2_ROOT22_AUTOGATE_STARTED=$(date -u +%FT%TZ)"
          sleep 240
          echo "VM2_ROOT22_AUTOGATE_SUCCESS=$(date -u +%FT%TZ)"
