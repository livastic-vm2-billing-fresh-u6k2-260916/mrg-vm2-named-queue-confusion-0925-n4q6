name: VM2 Owner Label Gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    name: vm2-named-queue-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require attacker-controlled gate to be green
        shell: bash
        run: |
          test "$(cat vm2-owner-label-gate.txt)" = "green"
