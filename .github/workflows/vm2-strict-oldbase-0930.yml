name: VM2 Strict Old Base Gate 0930
on:
  pull_request:
    branches:
      - vm2-strict-control-0930
      - vm2-strict-target-0930
permissions:
  contents: read
jobs:
  gate:
    name: vm2-strict-oldbase-gate
    runs-on: ubuntu-latest
    steps:
      - name: trusted old-base gate
        run: |
          echo "VM2_STRICT_GATE_HEAD=${{ github.event.pull_request.head.sha }}"
          echo "VM2_STRICT_GATE_BASE=${{ github.event.pull_request.base.sha }}"
          exit 0
