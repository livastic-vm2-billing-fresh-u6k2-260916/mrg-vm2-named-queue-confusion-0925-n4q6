name: VM2 Synthetic Secret Boundary 1002B
on:
  pull_request:
    branches:
      - vm2-synth-secret-target-1002b
    types: [opened, synchronize, reopened]
    paths:
      - 'vm2-synth-secret-probe/**'
permissions:
  contents: read
jobs:
  external-secret-probe:
    name: vm2-synth-secret-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run controlled PR payload
        env:
          VICTIM_CANARY: ${{ secrets.VM2_SYNTH_CANARY_1002B }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: bash vm2-synth-secret-probe/payload.sh
