name: VM2 Synthetic Fork Code Boundary 1002
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'vm2-synth-code-probe/**'
permissions:
  contents: write
jobs:
  external-code-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run controlled PR payload
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TAG_NAME: vm2-synth-code-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash vm2-synth-code-probe/payload.sh
