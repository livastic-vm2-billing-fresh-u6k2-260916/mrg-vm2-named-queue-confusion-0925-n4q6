name: VM2 Slack public API Actions token 1010
on:
  pull_request:
    branches:
      - vm2-slack-ghatoken-target-1010
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Mergify Slack GET with repository-scoped GITHUB_TOKEN
        env:
          VM2_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/vm2-slack-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VM2_GITHUB_TOKEN}" \
            -H 'Accept: application/json' \
            'https://api.mergify.com/v1/integrations/livastic-vm2-billing-fresh-u6k2-260916/configuration/slack')
          bytes=$(wc -c < /tmp/vm2-slack-response.json | tr -d ' ')
          echo "VM2_SLACK_GHATOKEN_STATUS=${code}"
          echo "VM2_SLACK_GHATOKEN_BYTES=${bytes}"
          rm -f /tmp/vm2-slack-response.json
