merge_queue:
  mode: serial

queue_rules:
  - name: privileged
    queue_conditions:
      - label = VM2_PRIVILEGED_N4Q6
    merge_conditions: []
    merge_method: merge

  - name: alternate
    queue_conditions:
      - title = VM2_ALT_N4Q6
    merge_conditions: []
    merge_method: merge

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

pull_request_rules:
  - name: VM2 locked revocation freshness gate
    conditions:
      - locked = true
      - title = VM2_LOCKED_ARM_0928
      - check-success = vm2-named-queue-gate
    actions:
      merge:
        method: merge
