# vm2 Root22 delayed automatic final-gate discriminator 0929
merge_queue:
  mode: serial

scopes:
  source:
    files:
      frontend:
        include:
          - frontend/**
  barrier_files:
    include:
      - global/**

queue_rules:
  - name: vm2 barrier root 1001
    queue_conditions:
      - title = VM2_BARRIER_AUTOQUEUE_1001
    merge_conditions:
      - check-success = vm2-barrier-ci-gate
    merge_method: merge
    autoqueue: true

  - name: product-disable-auto-finalizer
    queue_conditions:
      - title = VM2_MQ_PRODUCT_OFF_AUTOGATE_0929
    merge_conditions:
      - check-success = vm2-productoff-auto-final-gate
    merge_method: merge

  - name: privileged
    queue_conditions:
      - label = VM2_PRIVILEGED_N4Q6
    merge_conditions: []
    merge_method: merge

  - name: alternate
    queue_conditions:
      - title = VM2_ALT_N4Q6
    merge_conditions: []
    merge_method: merge

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

pull_request_rules:
  - name: VM2 app-authored blocking label freshness
    conditions:
      - -label = VM2_APP_BLOCK_0929
      - title = VM2_APPBLOCK_ARM_0929
      - check-success = vm2-named-queue-gate
    actions:
      merge:
        method: merge

  - name: VM2 classic strict control 0930
    conditions:
      - title = VM2_STRICT_CONTROL_0930
      - base = vm2-strict-control-0930
    actions:
      merge:
        method: merge

  - name: VM2 classic strict treatment 0930
    conditions:
      - title = VM2_STRICT_ARM_0930
      - base = vm2-strict-target-0930
    actions:
      merge:
        method: merge
