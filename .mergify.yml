merge_queue:
  mode: serial

queue_rules:
  - name: privileged
    queue_conditions:
      - label = VM2_PRIVILEGED_N4Q6
    merge_conditions: []
    merge_method: merge

  - name: alternate
    queue_conditions:
      - title = VM2_ALT_N4Q6
    merge_conditions: []
    merge_method: merge

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

pull_request_rules:
  - name: VM2 milestone revocation freshness gate
    conditions:
      - milestone = VM2_TRUSTED_MILESTONE_0927
      - title = VM2_MILESTONE_ARM_0927
      - check-success = vm2-named-queue-gate
    actions:
      merge:
        method: merge
