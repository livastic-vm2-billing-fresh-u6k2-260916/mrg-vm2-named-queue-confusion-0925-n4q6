# vm2 merge-queue product-disable in-flight finalizer discriminator 0929
merge_queue:
  mode: serial

queue_rules:
  - name: product-disable-finalizer
    queue_conditions: []
    merge_conditions:
      - check-success = vm2-productoff-final-gate
    merge_method: merge

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
