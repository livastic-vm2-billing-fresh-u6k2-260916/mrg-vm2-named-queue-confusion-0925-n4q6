# vm2 assignee revocation freshness gate
merge_queue:
  mode: serial

queue_rules:
  - name: privileged
    queue_conditions:
      - label = VM2_PRIVILEGED_N4Q6
    merge_conditions: []
    merge_method: merge

  - name: alternate
    queue_conditions:
      - title = VM2_ALT_N4Q6
    merge_conditions: []
    merge_method: merge

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

pull_request_rules:
  - name: VM2 assignee revocation freshness gate
    conditions:
      - assignee = livastic-vm2-secondary-20260911
      - title = VM2_ASSIGNEE_ARM_0927
      - check-success = vm2-named-queue-gate
    actions:
      merge:
        method: merge
