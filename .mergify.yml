# vm2 GitHub Actions blocking-label freshness discriminator 0929
merge_queue:
  mode: serial

queue_rules:
  - name: privileged
    queue_conditions:
      - label = VM2_PRIVILEGED_N4Q6
    merge_conditions: []
    merge_method: merge

  - name: alternate
    queue_conditions:
      - title = VM2_ALT_N4Q6
    merge_conditions: []
    merge_method: merge

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

pull_request_rules:
  - name: VM2 app-authored blocking label freshness
    conditions:
      - -label = VM2_APP_BLOCK_0929
      - title = VM2_APPBLOCK_ARM_0929
      - check-success = vm2-named-queue-gate
    actions:
      merge:
        method: merge
